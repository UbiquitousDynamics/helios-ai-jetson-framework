# Generated by pi-orchestrator (STEP-028). Changes go through review.
name: pi-fast-checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pi-fast-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: pi-fast-checks / lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: lint
        run: python -m ruff check .
      - name: Tested commit
        run: echo "tested ${{ github.event.pull_request.head.sha }}" >> "$GITHUB_STEP_SUMMARY"
  format:
    name: pi-fast-checks / format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: format
        run: python -m ruff format --check .
      - name: Tested commit
        run: echo "tested ${{ github.event.pull_request.head.sha }}" >> "$GITHUB_STEP_SUMMARY"
  compile:
    name: pi-fast-checks / compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: compile
        run: python -m compileall -q main.py assistant.py config.py api audio automation document observability recognizer scripts tests
      - name: Tested commit
        run: echo "tested ${{ github.event.pull_request.head.sha }}" >> "$GITHUB_STEP_SUMMARY"
  unit:
    name: pi-fast-checks / unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: unit
        run: python -m pytest -q
      - name: Tested commit
        run: echo "tested ${{ github.event.pull_request.head.sha }}" >> "$GITHUB_STEP_SUMMARY"
