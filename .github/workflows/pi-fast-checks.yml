          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: format
        run: python -m ruff format --check .
