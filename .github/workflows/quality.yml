name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install model-free test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Lint source
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Compile source
        run: >-
          python -m compileall -q
          main.py assistant.py config.py api audio document observability recognizer scripts tests

      - name: Run unit tests
        run: python -m pytest

      - name: Validate bundled asset inventory
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/doctor.py --assets-only --check-hashes
