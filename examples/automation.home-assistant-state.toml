# Inactive example. Use explicit private aliases and bridge credentials.
enabled = false
max_calls_per_turn = 1
allow_remote_context = false
allow_remote_catalog = false
allow_remote_home_state = false
allow_remote_results = false

[[servers]]
server_id = "homeassistant"
endpoint = "http://127.0.0.1:8123/api/mcp"
credential_env = "HELIOS_HA_TOKEN"
tools = ["GetDateTime"]
entities = []
areas = []

[[servers]]
server_id = "homeassistant_state"
endpoint = "http://127.0.0.1:8124/mcp"
credential_env = "HELIOS_HA_BRIDGE_TOKEN"
tools = ["GetEntityState"]
entities = ["light.example"]
areas = []
