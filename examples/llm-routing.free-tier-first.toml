schema_version = 1

# Certification template only. The catalog free_tier flag is informational:
# keep this configuration blocked until account-side hard no-overage controls
# and a current, independently reviewed catalog are in place.

[router]
policy = "remote_first"
remote_enabled = true
allowlist = ["groq", "ollama"]
denylist = []
unknown_connectivity = "allow_remote"

[privacy]
default = "remote_allowed"
allow_remote_transcripts = true
allow_remote_context = true
allow_remote_rag_context = false
redaction_failure = "local_only"

[timeouts]
connect_seconds = 2.0
first_token_seconds = 4.0
read_seconds = 12.0
total_seconds = 30.0

[health]
failures_to_open = 3
cooldown_seconds = 60.0
maximum_cooldown_seconds = 900.0
maximum_talk_first_audio_ms = 1500

[budget]
enabled = true
catalog_path = "model-catalog.example.json"
ledger_path = "../logs/llm-budget.jsonl"
per_request_usd = "0"
daily_usd = "0"
monthly_usd = "0"
zero_cost_only = true
missing_usage = "settle_reserved"

[observability]
metrics_enabled = true
metrics_path = "../logs/llm-metrics.jsonl"
log_content = false
log_headers = false
metrics_retention_days = 14

[modes.talk]
candidates = ["groq-talk", "local-talk"]
max_output_tokens = 64
complexity_threshold = 3
first_speech_min_chars = 24

[modes.think]
candidates = ["groq-think", "local-think"]
max_output_tokens = 256
complexity_threshold = 2
first_speech_min_chars = 0

[providers.groq]
adapter = "openai_chat_sse"
endpoint = "https://api.groq.com/openai/v1"
locality = "remote"
api_key_env = "GROQ_API_KEY"
enabled = true
internal_retries = 0

[targets.groq-talk]
provider = "groq"
model = "REPLACE_WITH_VERIFIED_GROQ_MODEL"
catalog_id = "groq/replace-me"
languages = ["it", "en"]
retry_attempts = 1
options = { temperature = 0.2 }

[targets.groq-think]
provider = "groq"
model = "REPLACE_WITH_VERIFIED_GROQ_MODEL"
catalog_id = "groq/replace-me"
languages = ["it", "en"]
retry_attempts = 1

[targets.local-talk]
provider = "ollama"
model_by_language = { it = "emilia-gemma3:1b", en = "emilia-en-gemma3:1b" }
languages = ["it", "en"]
retry_attempts = 3

[targets.local-think]
provider = "ollama"
model = "qwen3:0.6b"
languages = ["it", "en"]
retry_attempts = 3
