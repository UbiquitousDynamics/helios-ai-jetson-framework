schema_version = 1

[router]
policy = "auto"
remote_enabled = true
allowlist = ["groq", "ollama"]
denylist = []
unknown_connectivity = "prefer_local"

[privacy]
default = "remote_allowed"
allow_remote_transcripts = true
allow_remote_context = true
allow_remote_rag_context = false
redaction_failure = "local_only"

[budget]
enabled = true
catalog_path = "model-catalog.example.json"
ledger_path = "../logs/llm-budget.jsonl"
per_request_usd = "0"
daily_usd = "0"
monthly_usd = "0"
zero_cost_only = true
missing_usage = "settle_reserved"

[observability]
metrics_enabled = true
metrics_path = "../logs/llm-metrics.jsonl"
log_content = false
log_headers = false
metrics_retention_days = 14

[modes.talk]
candidates = ["local-talk"]
max_output_tokens = 64
complexity_threshold = 99
first_speech_min_chars = 0

[modes.think]
candidates = ["groq-think", "local-think"]
max_output_tokens = 256
complexity_threshold = 3
first_speech_min_chars = 0

[providers.groq]
adapter = "openai_chat_sse"
endpoint = "https://api.groq.com/openai/v1"
locality = "remote"
api_key_env = "GROQ_API_KEY"
enabled = true
internal_retries = 0

[targets.groq-think]
provider = "groq"
model = "REPLACE_WITH_VERIFIED_GROQ_MODEL"
catalog_id = "groq/replace-me"
languages = ["it", "en"]
retry_attempts = 1

[targets.local-talk]
provider = "ollama"
model_by_language = { it = "emilia-gemma3:1b", en = "emilia-en-gemma3:1b" }
languages = ["it", "en"]
retry_attempts = 3

[targets.local-think]
provider = "ollama"
model = "qwen3:0.6b"
languages = ["it", "en"]
retry_attempts = 3
